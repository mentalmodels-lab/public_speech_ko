    function avg(obj) {

    function RadarViz({ scores }) {
      const size=260, cx=130, cy=130, maxR=85, n=DIMS.length;
      const angle=i=>(i*2*Math.PI/n)-Math.PI/2;
      const pt=(r,i)=>({x:cx+r*Math.cos(angle(i)),y:cy+r*Math.sin(angle(i))});
      const dataPoints=DIMS.map((d,i)=>pt((scores[d.id]/5)*maxR,i));
      const dataPath=dataPoints.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+'Z';
      return (
        <svg width={size} height={size} style={{display:'block',margin:'0 auto'}}>
          {[1,2,3,4,5].map(lv=>{
            const gpath=DIMS.map((_,i)=>pt((lv/5)*maxR,i)).map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+'Z';
            return <path key={lv} d={gpath} fill="none" stroke="#e0ddd6" strokeWidth={1}/>;
          })}
          {DIMS.map((_,i)=>{const p=pt(maxR,i);return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="#e0ddd6" strokeWidth={1}/>;} )}
          <path d={dataPath} fill="#534AB7" fillOpacity={0.18} stroke="#534AB7" strokeWidth={2.5} strokeLinejoin="round"/>
          {dataPoints.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={4} fill="#534AB7"/>)}
          {DIMS.map((d,i)=>{const p=pt(maxR+28,i);const a=p.x<cx-6?'end':p.x>cx+6?'start':'middle';return <text key={i} x={p.x} y={p.y} textAnchor={a} dominantBaseline="middle" fontSize={10} fontWeight="700" fill="#555">{d.short}</text>;})}
        </svg>
      );
    }

        const id=setInterval(()=>setTimeLeft(t=>t-1),1000);
        return()=>clearInterval(id);
      },[running,timeLeft]);

      const newTopic=()=>{
        let idx;do{idx=Math.floor(Math.random()*TOPICS.length);}while(idx===topicIdx);

            <div style={{fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:8}}>오늘의 주제</div>
            <p style={{fontSize:17,fontWeight:700,color:'#1a1a1a',lineHeight:1.5,marginBottom:12}}>"{TOPICS[topicIdx]}"</p>
            <button onClick={newTopic} style={{fontSize:12,color:'#888',background:'none',border:'none',padding:0,textDecoration:'underline',cursor:'pointer'}}>다른 주제로 바꾸기</button>
          </div>

          <div className="card" style={{marginBottom:14,background:weakestDim.bg,border:`1px solid ${weakestDim.color}33`}}>
            <div style={{fontSize:11,fontWeight:700,color:weakestDim.color,textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:4}}>말하는 동안 이것에 집중하세요</div>
            <p style={{fontSize:14,color:'#333',lineHeight:1.65}}>
              <strong>{weakestDim.name}</strong> — {weakestDim.strategies[getLevel(weakestDim.score)][0]}
            </p>
          </div>

          <div className="card" style={{marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:10}}>구조 가이드</div>
            {[['무엇을','핵심 주장이나 답변을 말하세요.'],['왜 중요한가','청중에게 왜 의미 있는지 설명하세요.'],['그래서 어떻게','다음 행동이나 결론을 말하세요.']].map(([label,hint])=>(
              <div key={label} style={{display:'flex',gap:10,marginBottom:8}}>
                <span style={{fontSize:12,fontWeight:700,color:'#534AB7',width:64,flexShrink:0,paddingTop:2}}>{label}</span>
                <span style={{fontSize:13,color:'#555',lineHeight:1.55}}>{hint}</span>
              </div>
            ))}
          </div>

          <div className="card" style={{textAlign:'center',marginBottom:14}}>
            <div style={{fontSize:72,fontWeight:700,color:timerColor,lineHeight:1,marginBottom:4}}>{timeLeft}</div>
            <div style={{fontSize:12,color:'#888',marginBottom:14}}>초</div>
            <div className="progress-bar" style={{marginBottom:16,height:6}}>
              <div className="progress-fill" style={{width:`${pct}%`,background:timerColor,transition:'width 1s linear'}}/>
            </div>
            {done?(
              <div>
                <p style={{fontSize:15,fontWeight:700,color:'#1D9E75',marginBottom:14}}>시간 종료! 수고했어요.</p>
                <div style={{display:'flex',gap:10}}>
                  <button className="btn-ghost" onClick={reset} style={{flex:1}}>다시 해보기</button>
                  <button className="btn-primary" onClick={newTopic} style={{flex:1}}>새 주제 →</button>
                </div>
              </div>
            ):running?(
              <button className="btn-ghost" onClick={()=>setRunning(false)} style={{width:'100%'}}>일시정지</button>
            ):(
              <button className="btn-primary" onClick={()=>setRunning(true)}>{timeLeft===60?'시작하기':'계속하기'}</button>
            )}
          </div>
        </div>
      );
    }

    function PreChecklist({ allScores, onBack }) {
      const sorted=[...allScores].sort((a,b)=>a.score-b.score);
      const picks=[sorted[0],sorted[1],sorted[2],sorted[3],sorted[sorted.length-1]];
      const items=picks.map(d=>({dim:d,text:d.checklistItems[getLevel(d.score)]}));
      const [checked,setChecked]=useState({});
      const toggle=i=>setChecked(prev=>({...prev,[i]:!prev[i]}));
      const doneCount=Object.values(checked).filter(Boolean).length;
      const allChecked=doneCount===items.length;

      return (
        <div style={{maxWidth:520,margin:'0 auto'}}>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:24}}>
            <button className="btn-ghost" onClick={onBack} style={{padding:'8px 14px'}}>← 뒤로</button>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.04em'}}>발표 전</div>
              <h2 style={{fontSize:20,fontWeight:700}}>나의 체크리스트</h2>
            </div>
          </div>

          <div className="card" style={{marginBottom:14,background:'#f5f4f0',border:'none'}}>
            <p style={{fontSize:13,color:'#555',lineHeight:1.7}}>나의 점수 프로파일을 바탕으로, 다음 발표에서 가장 큰 차이를 만들 5가지 다짐입니다. 준비됐다고 느껴지면 하나씩 체크하세요.</p>
          </div>

          <div className="card" style={{marginBottom:14}}>
            {items.map((item,i)=>(
              <div key={i} className="check-row" onClick={()=>toggle(i)}>
                <div className={`checkbox${checked[i]?' checked':''}`}>
                  {checked[i]&&<svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                </div>
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:item.dim.color,textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:2}}>{item.dim.short}</div>
                  <p style={{fontSize:14,color:checked[i]?'#aaa':'#1a1a1a',lineHeight:1.6,textDecoration:checked[i]?'line-through':'none',transition:'all 0.2s'}}>{item.text}</p>
                </div>
              </div>
            ))}
          </div>

          <div style={{marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#888',marginBottom:6}}>
              <span>준비도</span><span>{doneCount}/{items.length} 완료</span>
            </div>
            <div className="progress-bar" style={{height:6}}>
              <div className="progress-fill" style={{width:`${(doneCount/items.length)*100}%`,background:allChecked?'#1D9E75':'#534AB7'}}/>
            </div>
          </div>

          {allChecked&&(
            <div style={{background:'#E1F5EE',border:'1px solid #5DCAA5',borderRadius:12,padding:'16px 20px',marginBottom:16,textAlign:'center'}}>
              <div style={{fontSize:24,marginBottom:6}}>✓</div>
              <p style={{fontSize:15,fontWeight:700,color:'#0F6E56',marginBottom:4}}>발표할 준비가 됐어요!</p>
              <p style={{fontSize:13,color:'#0F6E56'}}>준비를 믿고 당당하게 나가세요.</p>
            </div>
          )}
          <button className="btn-ghost" onClick={()=>setChecked({})} style={{width:'100%',textAlign:'center'}}>↺ 다시 시작</button>
        </div>
      );
    }

    function Results({ scores, name, onRestart, onPractice, onChecklist }) {
      const [tab,setTab]=useState('improve');
      const [status,setStatus]=useState('sending');
      const allScores=DIMS.map(d=>({...d,score:avg(scores[d.id])}));
      const sorted=[...allScores].sort((a,b)=>a.score-b.score);
      const radarScores={};
      DIMS.forEach(d=>{radarScores[d.id]=avg(scores[d.id]);});
      const weakest=sorted[0];

      useEffect(()=>{
        const payload={name};
        DIMS.forEach(d=>{payload[d.id]=avg(scores[d.id]);});
        fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
          .then(()=>setStatus('done')).catch(()=>setStatus('error'));
      },[]);

      const si={
        sending:{bg:'#f0ede8',color:'#888',icon:'⏳',text:'결과 저장 중...'},
        done:{bg:'#E1F5EE',color:'#0F6E56',icon:'✓',text:'선생님께 결과가 전달됐어요'},
        error:{bg:'#FAECE7',color:'#712B13',icon:'⚠',text:'저장 실패 — 인터넷 연결을 확인해주세요'}
      }[status];

      return (
        <div style={{maxWidth:520,margin:'0 auto'}}>
          <div style={{textAlign:'center',marginBottom:20}}>
            <span className="tag" style={{background:'#E1F5EE',color:'#0F6E56',marginBottom:10,display:'inline-block'}}>나의 결과</span>
            <h2 style={{fontSize:22,fontWeight:700,marginBottom:8}}>{name}의 발표 스킬 프로파일</h2>
            <div style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12,padding:'5px 14px',borderRadius:20,background:si.bg,color:si.color}}>
              <span>{si.icon}</span>{si.text}
            </div>
          </div>

          <div className="card" style={{marginBottom:16,padding:'20px 16px'}}>
            <RadarViz scores={radarScores}/>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:20}}>
            {allScores.map(d=>{const s=ls(d.score);return(
              <div key={d.id} className="card" style={{padding:'10px 12px'}}>
                <div style={{fontSize:20,fontWeight:700,color:d.color}}>{d.score.toFixed(1)}<span style={{fontSize:12,fontWeight:400,color:'#aaa'}}>/5</span></div>
                <div style={{fontSize:11,fontWeight:700,color:'#333',margin:'2px 0 5px',lineHeight:1.3}}>{d.short}</div>
                <span style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:4,background:s.bg,color:s.color}}>{getLabel(d.score)}</span>
              </div>
            );})}
          </div>

          <ThisWeekFocus dim={weakest}/>

          <div style={{display:'flex',borderRadius:10,overflow:'hidden',border:'0.5px solid #ddd',marginBottom:16}}>
            {[['improve','우선 전략'],['strengths','나의 강점']].map(([id,label])=>(
              <button key={id} className={`tab-btn${tab===id?' active':''}`} onClick={()=>setTab(id)}>{label}</button>
            ))}
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:14,marginBottom:24}}>
            {(tab==='improve'?sorted.slice(0,2):sorted.slice(-2).reverse()).map(d=>(
              <StrategyCard key={d.id} dim={d} type={tab==='improve'?'improve':'strength'}/>
            ))}
          </div>

          <p style={{fontSize:12,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:10}}>연습 도구</p>
          <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:24}}>
            <button className="btn-outline" onClick={onPractice} style={{border:'1.5px solid #534AB7',color:'#534AB7',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <span>⏱</span> 스피킹 연습 — 60초 즉흥 발표
            </button>
            <button className="btn-outline" onClick={onChecklist} style={{border:'1.5px solid #1D9E75',color:'#1D9E75',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <span>✓</span> 발표 전 체크리스트
            </button>
          </div>

          <button className="btn-ghost" onClick={onRestart} style={{width:'100%',textAlign:'center'}}>↺ 다시 진단하기</button>
        </div>
      );
    }

    function App() {
      const [step,setStep]=useState(0);
      const [answers,setAnswers]=useState({});
      const [name,setName]=useState('');
      const [mode,setMode]=useState(null);
      const setAns=(dimId,qi,val)=>setAnswers(prev=>({...prev,[dimId]:{...(prev[dimId]||{}),[qi]:val}}));
      const allScores=DIMS.map(d=>({...d,score:avg(answers[d.id])}));

      if(step===0)return <Welcome onStart={()=>setStep(1)}/>;
      if(step>=1&&step<=6){
        const dim=DIMS[step-1],da=answers[dim.id]||{};
        return <QuestionScreen dim={dim} step={step} answers={da} onAnswer={(qi,val)=>setAns(dim.id,qi,val)} onBack={()=>setStep(s=>s-1)} onNext={()=>setStep(s=>s+1)} canNext={Object.keys(da).length===3} isLast={step===6}/>;
      }
      if(step===7)return <NameScreen onNext={n=>{setName(n);setStep(8);}}/>;
      if(step===8){
        if(mode==='practice')return <PracticeMode weakestDim={[...allScores].sort((a,b)=>a.score-b.score)[0]} onBack={()=>setMode(null)}/>;
        if(mode==='checklist')return <PreChecklist allScores={allScores} onBack={()=>setMode(null)}/>;
        return <Results scores={answers} name={name} onRestart={()=>{setStep(0);setAnswers({});setName('');setMode(null);}} onPractice={()=>setMode('practice')} onChecklist={()=>setMode('checklist')}/>;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
